{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 border-0 shadow-sm bg-white" style="max-width: 450px; width: 100%; border-radius: 12px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold m-0">Recuperar <span class="text-warning">Palavra-passe</span></h4>
            <p class="text-muted small mt-2">Introduza o e-mail associado à sua conta para receber o link de redefinição.</p>
        </div>
        
        <form action="{{ url_for('auth.recuperar_senha') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Endereço de E-mail</label>
                <input type="email" name="email" class="form-control" placeholder="exemplo@dominio.com" style="border-radius: 8px;" required>
            </div>
            
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 text-dark" style="background-color: #FFCC00; border: none; border-radius: 8px;">
                Enviar Link por E-mail
            </button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Voltar para o Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
