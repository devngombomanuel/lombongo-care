{% extends 'base.html' %} {% block styles %}
<style>
  .auth-card {
    border-radius: 12px;
    background-color: #ffffff;
  }
  .form-control:focus {
    border-color: var(--lb-primary) !important;
    box-shadow: 0 0 0 0.25rem rgba(255, 204, 0, 0.25);
  }
</style>
{% endblock %} {% block content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 80vh"
>
  <div class="col-10 col-sm-8 col-md-6 col-lg-4">
    <div class="card p-4 border-custom shadow-sm auth-card">
      <div class="text-center mb-4">
        <div
          class="p-3 bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-2"
          style="width: 70px; height: 70px"
        >
          <i class="bi bi-wallet2 text-warning fs-1"></i>
        </div>
        <h3 class="fw-bold mt-2">Entrar no LombongoCare</h3>
        <p class="text-muted small">
          Faça a gestão inteligente do seu dinheiro
        </p>
      </div>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email</label>
          <input
            type="email"
            name="email"
            class="form-control border-custom"
            placeholder="exemplo@lombongo.com"
            required
          />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Palavra-passe</label>
          <input
            type="password"
            name="password"
            class="form-control border-custom"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary-yellow w-100 py-2 mb-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
        </button>

        <div class="text-center small">
          <span class="text-muted">Não tem conta?</span>
          <a
            href="{{ url_for('auth.register') }}"
            class="text-dark fw-bold text-decoration-none hover-link"
            >Criar Conta</a
          >
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
